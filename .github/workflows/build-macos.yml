name: Build macOS installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the installer to
        required: true
        default: v5.0.0-alpha

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v5

      - name: Build app with PyInstaller
        run: |
          uv sync
          uv pip install pyinstaller pyinstaller-hooks-contrib
          uv run pyinstaller -y --clean MANIC-mac.spec
          if [ ! -d dist/MANIC.app ]; then
            echo "dist/MANIC.app not produced" >&2
            exit 1
          fi

      - name: Build DMG and zip
        run: |
          VERSION=$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' scripts/build_macos.sh)
          if [ -z "$VERSION" ]; then
            echo "VERSION not found in scripts/build_macos.sh" >&2
            exit 1
          fi
          mkdir -p dist/dmg-root
          cp -R dist/MANIC.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname MANIC -srcfolder dist/dmg-root -ov -format UDZO "dist/MANIC-${VERSION}.dmg"
          ditto -c -k --keepParent "dist/MANIC-${VERSION}.dmg" dist/MANIC-Setup-Mac.dmg.zip
          if [ ! -f dist/MANIC-Setup-Mac.dmg.zip ]; then
            echo "dist/MANIC-Setup-Mac.dmg.zip not produced" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MANIC-Setup-Mac
          path: dist/MANIC-Setup-Mac.dmg.zip

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/MANIC-Setup-Mac.dmg.zip --clobber
